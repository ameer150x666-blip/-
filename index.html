<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=5.0">
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' https://www.gstatic.com https://cdnjs.cloudflare.com;
    style-src 'self' https://cdnjs.cloudflare.com;
    img-src 'self' data: https:;
    connect-src 'self' https://*.modrinth.com https://api.mcpedl.com https://*.googleapis.com https://*.firebaseio.com;
    object-src 'none';
    base-uri 'self';
    frame-ancestors 'none';
    form-action 'self';
  ">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=(), payment=(), usb=()">
  <title>ModCheck Pro · Modern Java & Bedrock</title>
  <!-- Font Awesome مع SRI -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" 
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" 
        crossorigin="anonymous">
  <!-- ملف CSS الخاص بالمشروع -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="neon-stripe"></div>
  <div class="bg-grid"></div>
  <div class="bg-radial"></div>

  <div class="app-container">
    <header class="header">
      <div class="header-left">
        <img src="assets/images/GAMAL.png" class="header-logo-img" alt="Logo" id="headerLogoImg">
        <div class="header-logo-fallback" id="headerLogoFallback"><i class="fa-solid fa-magnifying-glass"></i></div>
        <div>
          <div class="header-title">Mod<span class="accent">Check</span> Pro</div>
          <div class="header-subtitle">Advanced Mod Intelligence</div>
        </div>
      </div>
      <div class="user-area">
        <span id="shuffleBadge" class="shuffle-indicator" style="display:none;"><i class="fa-solid fa-shuffle"></i> Shuffled</span>
        <button class="platform-btn active" data-platform="java"><i class="fa-solid fa-mug-hot"></i> Java</button>
        <button class="platform-btn" data-platform="bedrock"><i class="fa-solid fa-cube"></i> Bedrock</button>
        <button class="user-btn" id="favoritesBtn"><i class="fa-solid fa-star"></i> Favorites</button>
        <button class="user-btn" id="compatBtn"><i class="fa-solid fa-link"></i> Compatibility</button>
        <button class="user-btn" id="loginBtn"><i class="fa-solid fa-right-to-bracket"></i> Login</button>
        <button class="user-btn" id="logoutBtn" style="display:none;"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
      </div>
      <div class="search-wrapper">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" class="search-input" id="searchInput" placeholder="Search mods, shaders, addons..." autocomplete="off">
        <span class="search-badge" id="platformBadge"><i class="fa-solid fa-globe"></i> JAVA</span>
        <button class="search-btn" id="searchBtn">SEARCH</button>
        <div class="autocomplete-dropdown" id="autocompleteDropdown"></div>
      </div>
    </header>

    <section class="hero-section">
      <div class="hero-logo-circle">
        <img src="assets/images/nk.png" alt="NK Logo" id="heroLogoImg">
        <span class="fallback-icon" id="heroLogoFallback"><i class="fa-solid fa-magnifying-glass"></i></span>
      </div>
    </section>

    <div class="ads-row-wrapper" id="adsRowWrapper">
      <div class="ads-row" id="adsRow"></div>
      <div class="ads-drag-hint">↔ اسحب لليسار واليمين لمشاهدة جميع الإعلانات</div>
    </div>

    <section class="filters-section" id="filtersSection"></section>

    <div class="stats-bar" id="statsBar"></div>

    <div class="grid" id="modsGrid">
      <div class="empty-state"><i class="fa-solid fa-magnifying-glass"></i> Search for mods...</div>
    </div>

    <div class="dev-credits">
      <div>Developed by <span style="color:var(--gold);">Gamal</span> 👨‍💻</div>
      <div>
        <a href="https://www.instagram.com/ga.mal1074?igsh=NnVoNzh2Mnl0cjgx" target="_blank" rel="noopener noreferrer" class="dev-social-link">
          <i class="fa-brands fa-instagram"></i> Instagram
        </a>
        <a href="https://www.tiktok.com/@gamalabdulnassir3?_r=1&_t=ZS-95oqgck1bzZ" target="_blank" rel="noopener noreferrer" class="dev-social-link">
          <i class="fa-brands fa-tiktok"></i> TikTok
        </a>
      </div>
    </div>
  </div>

  <!-- أوفرلاي التفاصيل -->
  <div class="mod-detail-overlay" id="modDetailOverlay">
    <div class="mod-detail-panel" id="modDetailPanel"></div>
  </div>

  <!-- نافذة التوافق -->
  <div class="compat-modal" id="compatModal">
    <div class="compat-content" id="compatContent"></div>
  </div>

  <!-- مكتبات Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <!-- ملفات JavaScript الخاصة بالمشروع -->
  <script src="js/firebase.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
