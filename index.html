<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=5.0, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' https://www.gstatic.com https://cdnjs.cloudflare.com 'unsafe-eval' 'unsafe-inline';
    style-src 'self' https://cdnjs.cloudflare.com 'unsafe-inline';
    img-src 'self' data: https:;
    connect-src 'self' https://*.modrinth.com https://api.curseforge.com https://*.googleapis.com https://*.firebaseio.com https://www.googleapis.com;
    object-src 'none';
    base-uri 'self';
    frame-ancestors 'none';
    form-action 'self';
  ">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=(), payment=(), usb=()">
  <title>ModVerse · Java & Bedrock Mods</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous">
  <!-- CSS مخصص -->
  <link rel="stylesheet" href="css/style.css">

  <!-- قاعدة المسار النسبي (مهم جداً) -->
  <base href="/">
</head>
<body>

  <div class="neon-stripe"></div>
  <div class="bg-grid"></div>
  <div class="bg-radial"></div>

  <div class="app-container">
    <header class="header">
      <div class="header-left">
        <img src="assets/images/GAMAL.png" class="header-logo-img" alt="Logo" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
        <div class="header-logo-fallback"><i class="fa-solid fa-magnifying-glass"></i></div>
        <div>
          <div class="header-title">Mod<span class="accent">Verse</span></div>
          <div class="header-subtitle">Java & Bedrock Mods</div>
        </div>
      </div>
      <div class="header-right">
        <button class="login-btn" id="loginBtn"><i class="fa-solid fa-user"></i> دخول</button>
        <button class="login-btn logout-btn" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> خروج</button>
      </div>
    </header>

    <div class="capsules-row">
      <button class="capsule active" data-feed="for-you">لك</button>
      <button class="capsule" data-feed="collections">المجموعات</button>
    </div>

    <div class="ads-row-wrapper">
      <div class="ads-row" id="adsRow"></div>
      <div class="ads-drag-hint">↔ اسحب للمزيد</div>
    </div>

    <div class="platform-row">
      <button class="platform-btn active" data-platform="java"><i class="fa-solid fa-mug-hot"></i> Java</button>
      <button class="platform-btn" data-platform="bedrock"><i class="fa-solid fa-cube"></i> Bedrock</button>
    </div>

    <section class="filters-section" id="filtersSection"></section>

    <div class="stats-bar" id="statsBar"></div>

    <div class="grid" id="modsGrid">
      <div class="empty-state"><i class="fa-solid fa-magnifying-glass"></i> جار التحميل...</div>
    </div>

    <div class="dev-credits">
      Developed by <span style="color:var(--accent);">Gamal</span> 👨‍💻
      <div>
        <a href="https://www.instagram.com/ga.mal1074" target="_blank"><i class="fa-brands fa-instagram"></i></a>
        <a href="https://www.tiktok.com/@gamalabdulnassir3" target="_blank"><i class="fa-brands fa-tiktok"></i></a>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <div class="nav-item active" data-tab="home"><i class="fa-solid fa-gamepad"></i><span>الرئيسية</span></div>
    <div class="nav-item" data-tab="explore"><i class="fa-solid fa-magnifying-glass"></i><span>استكشف</span></div>
    <div class="nav-item" data-tab="favorites"><i class="fa-solid fa-heart"></i><span>المفضلة</span></div>
    <div class="nav-item" data-tab="settings"><i class="fa-solid fa-gear"></i><span>الإعدادات</span></div>
  </nav>

  <div class="mod-detail-overlay" id="modDetailOverlay">
    <div class="mod-detail-panel" id="modDetailPanel"></div>
  </div>
  <div class="compat-modal" id="compatModal">
    <div class="compat-content" id="compatContent"></div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <!-- ملفات JavaScript محلية -->
  <script src="js/firebase.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
